version: 2

updates:
  # Dependabot reads pnpm projects through the "npm" ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The types must match the oldest supported Node version (engines.node),
    # otherwise APIs that do not exist there would pass the type check.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /benchmark
    schedule:
      interval: monthly
    groups:
      benchmark-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # Keeps the Kafka broker image of the integration test current.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
